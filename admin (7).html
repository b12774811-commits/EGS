<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ela Group Services Admin</title>
<meta name="description" content="Espace admin Ela Group Services">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#101B2D">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#101B2D; --amber:#EFA928; --teal:#1E8A78; --red:#C0392B;
    --bg:#F5F1E6; --card:#FFFFFF; --text:#1B1712; --soft:rgba(27,23,18,.62); --line:rgba(27,23,18,.16); }
  @media (prefers-color-scheme: dark){ :root{ --bg:#0E1420; --card:#161F30; --text:#F1ECDD; --soft:rgba(241,236,221,.64); --line:rgba(241,236,221,.18); --red:#ff7b6b; } }
  *{box-sizing:border-box;margin:0}
  body{font-family:"IBM Plex Sans",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
  h1,h2,h3,.brand{font-family:"Space Grotesk",system-ui,sans-serif}
  .top{background:var(--navy);color:#F6FBF8;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px}
  .brand{font-weight:700}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
  input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
  .btn{display:inline-flex;align-items:center;justify-content:center;border:0;cursor:pointer;font:600 .9rem "IBM Plex Sans",sans-serif;padding:10px 14px;border-radius:10px;background:var(--amber);color:#101B2D;text-decoration:none;min-height:42px}
  .btn.ghost{background:transparent;color:inherit;border:1px solid var(--line)}
  .btn.danger{background:transparent;color:var(--red);border:1px solid var(--red)}
  .btn:disabled{opacity:.55}
  .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .tag{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:99px;background:rgba(239,169,40,.25);margin-left:6px}
  .tag.off{background:rgba(192,57,43,.18);color:var(--red)}
  .soft{color:var(--soft);font-size:.88rem}
  .msg{padding:10px 12px;border-radius:10px;margin-top:12px;font-size:.92rem;background:rgba(192,57,43,.12);color:var(--red)}
  .prod{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
  .prod img,.prod .ph{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--bg);flex:none;display:flex;align-items:center;justify-content:center}
  textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;min-height:80px}
  .thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .thumbs div{position:relative}
  .thumbs img{width:72px;height:72px;border-radius:8px;object-fit:cover}
  .thumbs button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:#C0392B;color:#fff;cursor:pointer}
  .prod .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div class="top"><span class="brand">EGS · Admin produits</span><span id="who" class="soft" style="color:#F6FBF8;opacity:.8"></span></div>
<div class="wrap" id="app"><p class="soft">Chargement…</p></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, getDocs, addDoc, setDoc, doc, updateDoc, deleteDoc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const ADMIN_EMAIL = "elagroupservices96@gmail.com";
const app = initializeApp({
  apiKey: "AIzaSyDz8eWj67YWFq5mPu5X_e2q9n6YHq0XF-k",
  authDomain: "elagroupservices-7d3b6.firebaseapp.com",
  projectId: "elagroupservices-7d3b6",
  storageBucket: "elagroupservices-7d3b6.firebasestorage.app",
  messagingSenderId: "402394593738",
  appId: "1:402394593738:web:10282d65f1c5fb04463733"
});
const auth = getAuth(app), db = getFirestore(app);
const root = document.getElementById("app"), who = document.getElementById("who");
function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const x of kids.flat()) if (x != null) e.append(x.nodeType ? x : document.createTextNode(x));
  return e;
}
const fmt = n => Number(n).toLocaleString("fr-FR") + " FCFA";
const okImg = s => typeof s === "string" && /^(data:image\/(jpeg|png|webp);base64,|https:\/\/)/.test(s);
const logout = () => h("button", { class: "btn ghost", onclick: () => signOut(auth) }, "Se déconnecter");
const err = t => h("div", { class: "msg" }, t);

function compress(file, max = 900, q = 0.72) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const r = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("image")); };
    img.src = url;
  });
}

function viewLogin() {
  const msg = h("div");
  const email = h("input", { type: "email", required: "", value: ADMIN_EMAIL });
  const pass = h("input", { type: "password", required: "", autocomplete: "current-password" });
  root.replaceChildren(h("div", { class: "panel" }, h("h2", {}, "Connexion administrateur"),
    h("form", { onsubmit: async ev => { ev.preventDefault(); msg.replaceChildren();
      try { await signInWithEmailAndPassword(auth, email.value.trim(), pass.value); }
      catch (e) { msg.replaceChildren(err("E-mail ou mot de passe incorrect.")); } } },
      h("label", {}, "E-mail"), email, h("label", {}, "Mot de passe"), pass,
      h("div", { class: "row" }, h("button", { class: "btn", type: "submit" }, "Se connecter")), msg)));
}

async function viewList() {
  root.replaceChildren(h("p", { class: "soft" }, "Chargement des produits…"));
  let list = [];
  try {
    const snap = await getDocs(query(collection(db, "products"), orderBy("createdAt", "desc")));
    list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch (e) { root.replaceChildren(err("Impossible de charger les produits (" + (e.code || "erreur") + ")."), h("div", { class: "row" }, logout())); return; }
  const panel = h("div", { class: "panel" });
  if (!list.length) panel.append(h("p", { class: "soft" }, "Aucun produit pour le moment."));
  list.forEach(p => {
    const im = (Array.isArray(p.imgs) && p.imgs[0]) || p.img;
    const row = h("div", { class: "prod" },
      okImg(im) ? h("img", { src: im, alt: "" }) : h("div", { class: "ph" }, "🛍"),
      h("div", { class: "n" }, p.name, p.discount > 0 ? h("span", { class: "tag" }, "−" + p.discount + " %") : null, h("div", { class: "soft" }, fmt(p.price))),
      h("button", { class: "btn ghost", onclick: () => viewForm(p) }, "Modifier"),
      h("button", { class: "btn danger", onclick: async () => {
        if (!confirm("Supprimer « " + p.name + " » ?")) return;
        try { await deleteDoc(doc(db, "products", p.id)); viewList(); } catch (e) { alert("Suppression impossible (" + (e.code || "erreur") + ")."); }
      } }, "Supprimer"));
    panel.append(row);
  });
  root.replaceChildren(h("h2", { style: "margin-bottom:12px" }, list.length + (list.length > 1 ? " produits" : " produit")),
    h("div", { class: "row", style: "margin-bottom:12px" }, h("button", { class: "btn", onclick: () => viewForm(null) }, "+ Ajouter un produit"),
      h("button", { class: "btn ghost", onclick: viewServices }, "Photos des services"), h("button", { class: "btn ghost", onclick: viewShops }, "Boutiques vendeurs"), logout()), panel);
}

async function viewShops() {
  root.replaceChildren(h("p", { class: "soft" }, "Chargement des boutiques…"));
  let shops = [];
  try { shops = (await getDocs(collection(db, "shops"))).docs.map(d => ({ uid: d.id, ...d.data() })); }
  catch (e) { root.replaceChildren(err("Impossible de charger les boutiques (" + (e.code || "erreur") + ")."), h("div", { class: "row" }, h("button", { class: "btn ghost", onclick: viewList }, "Retour"))); return; }
  const panel = h("div", { class: "panel" });
  if (!shops.length) panel.append(h("p", { class: "soft" }, "Aucune boutique de vendeur pour le moment."));
  shops.forEach(sh => {
    const blocked = sh.blocked === true;
    panel.append(h("div", { class: "prod", style: "flex-wrap:wrap" },
      h("div", { class: "n", style: "white-space:normal" }, sh.name || "(sans nom)", blocked ? h("span", { class: "tag off" }, "Bloquée") : null,
        h("div", { class: "soft" }, (sh.slug ? "/" + sh.slug : "") + (sh.whatsapp ? " · " + sh.whatsapp : ""))),
      h("button", { class: "btn ghost", onclick: () => viewShopItems(sh) }, "Articles"),
      h("button", { class: "btn ghost", onclick: async () => {
        try { await updateDoc(doc(db, "shops", sh.uid), { blocked: !blocked }); viewShops(); } catch (e) { alert("Action impossible (" + (e.code || "erreur") + ")."); }
      } }, blocked ? "Débloquer" : "Bloquer"),
      h("button", { class: "btn danger", onclick: async () => {
        if (!confirm("Supprimer toute la boutique « " + (sh.name || "") + " » et tous ses articles ?")) return;
        try {
          const its = await getDocs(collection(db, "shops", sh.uid, "items"));
          await Promise.all(its.docs.map(d => deleteDoc(d.ref)));
          await deleteDoc(doc(db, "shops", sh.uid)); viewShops();
        } catch (e) { alert("Suppression impossible (" + (e.code || "erreur") + ")."); }
      } }, "Supprimer")));
  });
  root.replaceChildren(h("h2", { style: "margin-bottom:4px" }, "Boutiques vendeurs (" + shops.length + ")"),
    h("p", { class: "soft", style: "margin-bottom:12px" }, "Bloquer cache la boutique du site sans rien effacer. Supprimer efface la boutique et ses articles."),
    h("div", { class: "row", style: "margin-bottom:12px" }, h("button", { class: "btn ghost", onclick: viewList }, "← Mes produits")), panel);
}

async function viewShopItems(sh) {
  root.replaceChildren(h("p", { class: "soft" }, "Chargement des articles…"));
  let items = [];
  try { items = (await getDocs(collection(db, "shops", sh.uid, "items"))).docs.map(d => ({ id: d.id, ...d.data() })); }
  catch (e) { root.replaceChildren(err("Impossible de charger (" + (e.code || "erreur") + ")."), h("div", { class: "row" }, h("button", { class: "btn ghost", onclick: viewShops }, "Retour"))); return; }
  const panel = h("div", { class: "panel" });
  if (!items.length) panel.append(h("p", { class: "soft" }, "Aucun article."));
  items.forEach(it => {
    const im = (Array.isArray(it.imgs) && it.imgs[0]) || it.img;
    panel.append(h("div", { class: "prod" },
      okImg(im) ? h("img", { src: im, alt: "" }) : h("div", { class: "ph" }, "🛍"),
      h("div", { class: "n" }, it.name || "(sans nom)", h("div", { class: "soft" }, it.price != null && it.price !== "" ? fmt(it.price) : "")),
      h("button", { class: "btn danger", onclick: async () => {
        if (!confirm("Supprimer « " + (it.name || "cet article") + " » ?")) return;
        try { await deleteDoc(doc(db, "shops", sh.uid, "items", it.id)); viewShopItems(sh); } catch (e) { alert("Suppression impossible (" + (e.code || "erreur") + ")."); }
      } }, "Supprimer")));
  });
  root.replaceChildren(h("h2", { style: "margin-bottom:12px" }, "Articles de " + (sh.name || "la boutique")),
    h("div", { class: "row", style: "margin-bottom:12px" }, h("button", { class: "btn ghost", onclick: viewShops }, "← Boutiques")), panel);
}

function viewForm(p) {
  let imgs = p ? ((Array.isArray(p.imgs) && p.imgs.length) ? p.imgs.slice() : (p.img ? [p.img] : [])) : [];
  const name = h("input", { required: "", maxlength: "120", value: p ? p.name : "" });
  const price = h("input", { type: "number", min: "0", inputmode: "numeric", required: "", value: p ? p.price : "" });
  const disc = h("input", { type: "number", min: "0", max: "90", inputmode: "numeric", value: p && p.discount ? p.discount : "" });
  const desc = h("textarea", {}); desc.value = p ? (p.desc || "") : "";
  const video = h("input", { type: "url", placeholder: "https://… (YouTube ou .mp4, facultatif)", value: p ? (p.video || "") : "" });
  const thumbs = h("div", { class: "thumbs" }), msg = h("div");
  const paint = () => thumbs.replaceChildren(...imgs.map((s, i) => h("div", {}, h("img", { src: s, alt: "" }),
    h("button", { type: "button", "aria-label": "Retirer", onclick: () => { imgs.splice(i, 1); paint(); } }, "×"))));
  paint();
  const file = h("input", { type: "file", accept: "image/*", multiple: "", onchange: async () => {
    msg.replaceChildren();
    for (const f of [...file.files]) {
      if (imgs.length >= 4) { msg.replaceChildren(err("4 photos maximum par produit.")); break; }
      try { imgs.push(await compress(f)); } catch { msg.replaceChildren(err("Une photo n'a pas pu être lue.")); }
    }
    file.value = ""; paint();
  } });
  const save = h("button", { class: "btn", type: "submit" }, "Enregistrer");
  root.replaceChildren(h("div", { class: "panel" }, h("h2", {}, p ? "Modifier le produit" : "Ajouter un produit"),
    h("form", { onsubmit: async ev => {
      ev.preventDefault(); msg.replaceChildren(); save.disabled = true;
      const data = { name: name.value.trim(), price: Number(price.value), discount: Number(disc.value) || 0,
        desc: desc.value.trim(), video: video.value.trim(), imgs, img: imgs[0] || "" };
      try {
        if (p) await updateDoc(doc(db, "products", p.id), data);
        else await addDoc(collection(db, "products"), { ...data, createdAt: serverTimestamp() });
        viewList();
      } catch (e) { msg.replaceChildren(err("Enregistrement impossible (" + (e.code || "erreur") + ").")); save.disabled = false; }
    } },
      h("label", {}, "Nom du produit"), name, h("label", {}, "Prix (FCFA)"), price,
      h("label", {}, "Réduction en % (facultatif)"), disc, h("label", {}, "Description"), desc,
      h("label", {}, "Photos (4 maximum)"), file, thumbs, h("label", {}, "Vidéo (facultatif)"), video,
      h("div", { class: "row" }, save, h("button", { class: "btn ghost", type: "button", onclick: viewList }, "Annuler")), msg)));
}

const SERVICES = [
  ["site", "Création de site web"], ["vente", "Création de page de vente"], ["facebook", "Boostage de page Facebook"],
  ["catalogue", "Catalogue numérique pour vendeurs"], ["photo-ia", "Restauration de photos par IA"],
  ["maintenance", "Maintenance informatique"], ["pointage", "Application de pointage des présences"],
  ["import", "Import/export Chine – Abidjan"], ["musique", "Formation musicale à domicile"]
];

async function viewServices() {
  root.replaceChildren(h("p", { class: "soft" }, "Chargement des prestations…"));
  const data = {};
  try { (await getDocs(collection(db, "services"))).forEach(d => { data[d.id] = d.data(); }); }
  catch (e) { root.replaceChildren(err("Impossible de charger (" + (e.code || "erreur") + ")."), h("div", { class: "row" }, h("button", { class: "btn ghost", onclick: viewList }, "Retour"))); return; }
  root.replaceChildren(h("h2", { style: "margin-bottom:4px" }, "Photos des services"),
    h("p", { class: "soft", style: "margin-bottom:12px" }, "Une photo par prestation, ou deux photos Avant / Après avec un curseur de comparaison."),
    h("div", { class: "row", style: "margin-bottom:12px" }, h("button", { class: "btn ghost", onclick: viewList }, "← Mes produits")),
    ...SERVICES.map(([id, label]) => serviceCard(id, label, data[id] || {})));
}

function serviceCard(id, label, v) {
  let img = v.img || "", before = v.before || "", after = v.after || "";
  const mode = h("select", { style: "width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit" },
    h("option", { value: "one" }, "Une seule photo"), h("option", { value: "ba" }, "Avant / Après"));
  mode.value = (v.before && v.after) ? "ba" : "one";
  const zone = h("div"), msg = h("div");
  const pick = (get, set) => {
    const t = h("div", { class: "thumbs" });
    const paint = () => t.replaceChildren(...(get() ? [h("div", {}, h("img", { src: get(), alt: "" }), h("button", { type: "button", "aria-label": "Retirer", onclick: () => { set(""); paint(); } }, "×"))] : []));
    paint();
    const f = h("input", { type: "file", accept: "image/*", onchange: async () => {
      if (!f.files[0]) return;
      try { set(await compress(f.files[0], 1600, 0.82)); msg.replaceChildren(); } catch { msg.replaceChildren(err("Cette photo n'a pas pu être lue.")); }
      f.value = ""; paint();
    } });
    return [f, t];
  };
  const draw = () => {
    if (mode.value === "one") zone.replaceChildren(h("label", {}, "Photo"), ...pick(() => img, x => { img = x; }));
    else zone.replaceChildren(h("label", {}, "Photo avant"), ...pick(() => before, x => { before = x; }), h("label", {}, "Photo après"), ...pick(() => after, x => { after = x; }));
  };
  mode.onchange = draw; draw();
  const save = h("button", { class: "btn", type: "button", onclick: async () => {
    msg.replaceChildren(); save.disabled = true;
    try {
      if (mode.value === "ba") {
        if (!before || !after) { msg.replaceChildren(err("Ajoutez les deux photos (avant et après).")); save.disabled = false; return; }
        await setDoc(doc(db, "services", id), { before, after, img: "" });
      } else {
        await setDoc(doc(db, "services", id), { img, before: "", after: "" });
      }
      msg.replaceChildren(h("div", { class: "msg", style: "background:rgba(30,138,120,.14);color:var(--teal)" }, "Enregistré."));
    } catch (e) { msg.replaceChildren(err("Enregistrement impossible (" + (e.code || "erreur") + ").")); }
    save.disabled = false;
  } });
  return h("div", { class: "panel" }, h("h3", {}, label), h("label", {}, "Type"), mode, zone, h("div", { class: "row" }, save), msg);
}

onAuthStateChanged(auth, u => {
  who.textContent = u ? u.email : "";
  if (!u) return viewLogin();
  if (u.email !== ADMIN_EMAIL) { root.replaceChildren(err("Accès réservé à l'administrateur."), h("div", { class: "row" }, logout())); return; }
  viewList();
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace vendeur | Ela Group Services</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#101B2D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#101B2D; --amber:#EFA928; --amber-deep:#C97F0F; --teal:#1E8A78; --red:#C0392B;
    --bg:#F5F1E6; --card:#FFFFFF; --text:#1B1712; --soft:rgba(27,23,18,.62); --line:rgba(27,23,18,.16);
    --grad:linear-gradient(135deg,#0A3556 0%,#0D6A78 55%,#16A068 100%);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0E1420; --card:#161F30; --text:#F1ECDD; --soft:rgba(241,236,221,.64); --line:rgba(241,236,221,.18); --red:#ff7b6b; }
  }
  *{box-sizing:border-box;margin:0}
  body{font-family:"IBM Plex Sans",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
  h1,h2,h3,.brand{font-family:"Space Grotesk",system-ui,sans-serif}
  .top{background:var(--navy);color:#F6FBF8;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px}
  .brand{font-weight:700;text-decoration:none;color:inherit}
  .wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
  .panel h2{font-size:1.2rem;margin-bottom:4px}
  .hint{color:var(--soft);font-size:.9rem;margin-bottom:12px}
  label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
  input,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
  textarea{min-height:80px;resize:vertical}
  input:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:1px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;font:600 .95rem "IBM Plex Sans",sans-serif;
       padding:12px 18px;border-radius:10px;background:var(--amber);color:#101B2D;text-decoration:none;min-height:44px}
  .btn:hover{background:#f5b94a}
  .btn:disabled{opacity:.55;cursor:wait}
  .btn.ghost{background:transparent;color:inherit;border:1px solid var(--line)}
  .btn.danger{background:transparent;color:var(--red);border:1px solid var(--red)}
  .btn.wa{background:#16A068;color:#fff}
  .btn.block{width:100%;margin-top:16px}
  .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
  .tabs button{padding:10px;border:1px solid var(--line);background:transparent;color:inherit;border-radius:10px;font:600 .95rem "IBM Plex Sans";cursor:pointer;min-height:44px}
  .tabs button[aria-selected="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
  .msg{padding:10px 12px;border-radius:10px;margin-top:12px;font-size:.92rem}
  .msg.err{background:rgba(192,57,43,.12);color:var(--red)}
  /* Badge "1 mois gratuit" qui clignote doucement */
  .promo{display:inline-block;background:#FFC93C;color:#101B2D;font-weight:700;padding:6px 12px;border-radius:999px;font-size:.9rem;animation:promo-blink 1.1s ease-in-out infinite}
  @keyframes promo-blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.06)}}
  @media (prefers-reduced-motion: reduce){ .promo{animation:none} }
  .thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .thumbs div{position:relative}
  .thumbs img{width:76px;height:76px;border-radius:8px;object-fit:cover;display:block}
  .thumbs button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:#C0392B;color:#fff;cursor:pointer}
  .msg.ok{background:rgba(30,138,120,.14);color:var(--teal)}
  .linkbox{display:flex;gap:8px;align-items:center;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px;word-break:break-all;font-size:.9rem}
  .item{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
  .item:first-of-type{border-top:0}
  .thumb{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--bg);flex:none;display:flex;align-items:center;justify-content:center}
  .item .info{flex:1;min-width:0}
  .item .info b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .info span{color:var(--soft);font-size:.88rem}
  .item .acts{display:flex;gap:6px;flex-wrap:wrap;width:100%;justify-content:flex-start}
  .item .acts .btn{padding:8px 12px;min-height:38px;font-size:.85rem}
  .preview{width:140px;height:140px;border-radius:12px;object-fit:cover;margin-top:8px;display:block}
  .check{display:flex;align-items:center;gap:10px;margin-top:14px;font-weight:600}
  .check input{width:22px;height:22px}
  .slugrow{display:flex;align-items:center;gap:6px;font-size:.88rem;color:var(--soft)}
  .slugrow input{flex:1}
  a.link{color:var(--teal);font-weight:600}
</style>
</head>
<body>
<div class="top">
  <a class="brand" href="boutique.html">EGS · Espace vendeur</a>
  <span id="who" style="font-size:.85rem;opacity:.85"></span>
</div>
<div class="wrap" id="app"><p style="padding:30px 0;text-align:center;color:var(--soft)">Chargement…</p></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, sendPasswordResetEmail }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, getDoc, getDocs, addDoc, updateDoc, deleteDoc, writeBatch, increment, collection, query, orderBy, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyDz8eWj67YWFq5mPu5X_e2q9n6YHq0XF-k",
  authDomain: "elagroupservices-7d3b6.firebaseapp.com",
  projectId: "elagroupservices-7d3b6",
  storageBucket: "elagroupservices-7d3b6.firebasestorage.app",
  messagingSenderId: "402394593738",
  appId: "1:402394593738:web:10282d65f1c5fb04463733"
});
const auth = getAuth(app), db = getFirestore(app);
const root = document.getElementById("app"), who = document.getElementById("who");

function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "value") e.value = v;
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const x of kids.flat()) if (x != null) e.append(x.nodeType ? x : document.createTextNode(x));
  return e;
}
const fmt = n => Number(n).toLocaleString("fr-FR") + " FCFA";
const safeImg = s => typeof s === "string" && /^data:image\/(jpeg|png|webp);base64,/.test(s) ? s : "";
const baseUrl = () => new URL("boutique.html", location.href).href;

function authError(e) {
  const c = (e && e.code) || "";
  if (c.includes("email-already-in-use")) return "Cet e-mail a déjà un compte. Utilisez « Se connecter ».";
  if (c.includes("weak-password")) return "Mot de passe trop court (6 caractères minimum).";
  if (c.includes("invalid-email")) return "Adresse e-mail invalide.";
  if (c.includes("invalid-credential") || c.includes("wrong-password") || c.includes("user-not-found")) return "E-mail ou mot de passe incorrect.";
  if (c.includes("network")) return "Pas de connexion internet. Réessayez.";
  if (c.includes("operation-not-allowed")) return "La connexion par e-mail n'est pas encore activée dans Firebase (voir les instructions).";
  return "Une erreur est survenue. Réessayez.";
}
function phoneNorm(raw) {
  let d = String(raw || "").replace(/\D/g, "");
  if (d.startsWith("00")) d = d.slice(2);
  if (d.length === 10) return "225" + d;
  if (d.length >= 11 && d.length <= 15) return d;
  return null;
}
function slugify(s) {
  return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40);
}
function compress(file, max = 800, q = 0.75) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u); res(c.toDataURL("image/jpeg", q));
    };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error("image")); };
    img.src = u;
  });
}
const note = (cls, text) => h("div", { class: "msg " + cls, role: "status" }, text);

let user = null, shop = null, items = [];
/* ---- Abonnement : 1 mois gratuit, puis 5 000 FCFA / mois (activation manuelle dans abonnements/{uid}.paidUntil) ---- */
const TRIAL_DAYS = 30, PRICE = 5000, LAUNCH = new Date("2026-11-03T00:00:00Z");
const ADMIN_WA = "2250757995853", WAVE_PAY = "https://pay.wave.com/m/M_ci_MvxNaY-sPyup/c/ci/";
const BOOST_PRICE = 2000, BOOST_DAYS = 7;
let sub = null;
function subStatus() {
  const c = shop && shop.createdAt && shop.createdAt.toDate ? shop.createdAt.toDate() : new Date();
  const start = c > LAUNCH ? c : LAUNCH;
  const trialEnd = new Date(start.getTime() + TRIAL_DAYS * 864e5);
  const paid = sub && sub.paidUntil && sub.paidUntil.toDate ? sub.paidUntil.toDate() : null;
  const until = paid && paid > trialEnd ? paid : trialEnd;
  const now = new Date();
  return { active: now < until, until, paid: !!(paid && paid > trialEnd), days: Math.max(0, Math.ceil((until - now) / 864e5)) };
}

/* ---------- Écran 1 : connexion / inscription ---------- */
function logoField(initial) {
  let logo = initial || "";
  const prev = h("img", { class: "preview", alt: "Logo", style: safeImg(logo) ? "" : "display:none" });
  if (safeImg(logo)) prev.src = logo;
  const msg = h("div");
  const file = h("input", { type: "file", accept: "image/*", onchange: async () => {
    const f = file.files[0]; if (!f) return;
    try { logo = await compress(f, 300, 0.8); prev.src = logo; prev.style.display = ""; msg.replaceChildren(); }
    catch { msg.replaceChildren(note("err", "Cette photo n'a pas pu être lue. Essayez-en une autre.")); }
  } });
  return { nodes: [h("label", {}, "Logo ou photo de la boutique (facultatif)"), file, prev, msg], get: () => logo };
}
function viewAuth(mode = "signup") {
  const msgBox = h("div");
  const email = h("input", { type: "email", autocomplete: "email", required: "", placeholder: "vous@exemple.com" });
  const pass = h("input", { type: "password", autocomplete: mode === "signup" ? "new-password" : "current-password", required: "", placeholder: "6 caractères minimum" });
  const submit = h("button", { class: "btn block", type: "submit" }, mode === "signup" ? "Créer mon compte" : "Se connecter");
  const form = h("form", {
    onsubmit: async ev => {
      ev.preventDefault(); submit.disabled = true; msgBox.replaceChildren();
      try {
        if (mode === "signup") await createUserWithEmailAndPassword(auth, email.value.trim(), pass.value);
        else await signInWithEmailAndPassword(auth, email.value.trim(), pass.value);
      } catch (e) { msgBox.replaceChildren(note("err", authError(e))); submit.disabled = false; }
    }
  }, h("label", {}, "E-mail"), email, h("label", {}, "Mot de passe"), pass, submit, msgBox);
  const forgot = mode === "login" ? h("p", { class: "hint", style: "margin-top:12px" }, h("a", { class: "link", href: "#", onclick: async ev => {
    ev.preventDefault();
    if (!email.value.trim()) { msgBox.replaceChildren(note("err", "Écrivez d'abord votre e-mail ci-dessus.")); return; }
    try { await sendPasswordResetEmail(auth, email.value.trim()); msgBox.replaceChildren(note("ok", "E-mail envoyé : ouvrez-le pour choisir un nouveau mot de passe.")); }
    catch (e) { msgBox.replaceChildren(note("err", authError(e))); }
  } }, "Mot de passe oublié ?")) : null;
  const tab = (m, label) => h("button", { type: "button", role: "tab", "aria-selected": String(mode === m), onclick: () => viewAuth(m) }, label);
  root.replaceChildren(
    h("div", { class: "panel" },
      h("h2", {}, "Ouvrez votre boutique en ligne"),
      h("p", {}, h("span", { class: "promo" }, "🎁 1er mois gratuit, puis 5 000 FCFA/mois")),
      h("p", { class: "hint" }, "Gratuit. Ajoutez vos produits, partagez votre lien, vos clients commandent sur votre WhatsApp."),
      h("div", { class: "tabs", role: "tablist" }, tab("signup", "Créer un compte"), tab("login", "Se connecter")),
      form, forgot));
}

/* ---------- Écran 2 : créer la boutique ---------- */
function viewCreateShop() {
  const msgBox = h("div");
  const name = h("input", { required: "", maxlength: "60", placeholder: "Ex. Elegance Boutique" });
  const slugIn = h("input", { required: "", maxlength: "40", pattern: "[a-z0-9\\-]{2,40}", placeholder: "elegance-boutique", "aria-label": "Adresse de la boutique" });
  let touched = false;
  slugIn.addEventListener("input", () => { touched = true; });
  name.addEventListener("input", () => { if (!touched) slugIn.value = slugify(name.value); });
  const wa = h("input", { type: "tel", required: "", inputmode: "tel", placeholder: "07 57 99 58 53" });
  const desc = h("textarea", { maxlength: "200", placeholder: "Ex. Vêtements et chaussures, livraison à Abidjan." });
  const logoF = logoField("");
  const submit = h("button", { class: "btn block", type: "submit" }, "Créer ma boutique");
  const form = h("form", {
    onsubmit: async ev => {
      ev.preventDefault(); msgBox.replaceChildren();
      const num = phoneNorm(wa.value), sl = slugify(slugIn.value);
      if (!num) { msgBox.replaceChildren(note("err", "Numéro WhatsApp invalide. Exemple : 07 57 99 58 53")); return; }
      if (sl.length < 2) { msgBox.replaceChildren(note("err", "L'adresse de la boutique est trop courte.")); return; }
      submit.disabled = true;
      try {
        const data = { name: name.value.trim(), slug: sl, whatsapp: num, description: desc.value.trim(), ownerUid: user.uid, createdAt: serverTimestamp() };
        if (logoF.get()) data.logo = logoF.get();
        const b = writeBatch(db);
        b.set(doc(db, "slugs", sl), { uid: user.uid });
        b.set(doc(db, "shops", user.uid), data);
        await b.commit();
        await loadShop(); render();
      } catch (e) {
        console.warn(e);
        msgBox.replaceChildren(note("err", (e.code || "").includes("permission") ? "Cette adresse est peut-être déjà prise. Changez-la un peu (ex. ajoutez votre ville)." : "Impossible de créer la boutique. Réessayez."));
        submit.disabled = false;
      }
    }
  },
    h("label", {}, "Nom de la boutique"), name,
    h("label", {}, "Adresse de la boutique"),
    h("div", { class: "slugrow" }, h("span", {}, "boutique.html?b="), slugIn),
    h("label", {}, "Votre numéro WhatsApp (pour recevoir les commandes)"), wa,
    h("label", {}, "Description courte (facultatif)"), desc, ...logoF.nodes, submit, msgBox);
  root.replaceChildren(h("div", { class: "panel" }, h("h2", {}, "Créez votre boutique"), h("p", { class: "hint" }, "Cela prend une minute. Vous pourrez modifier le nom, le numéro et la description plus tard."), form), logoutBtn());
}

/* ---------- Écran 3 : tableau de bord ---------- */
function logoutBtn() { return h("button", { class: "btn ghost", onclick: () => signOut(auth) }, "Se déconnecter"); }

function viewExpired() {
  const msg = "Bonjour, j'ai payé mon abonnement (" + fmt(PRICE) + ").\nBoutique : " + shop.name + "\nIdentifiant : " + user.uid;
  root.replaceChildren(
    h("div", { class: "panel" },
      h("h2", {}, "Votre abonnement est terminé"),
      h("p", { class: "hint" }, "Pour réactiver votre boutique et la rendre de nouveau visible, payez l'abonnement du mois : " + fmt(PRICE) + ". Aucune commission n'est prise sur vos ventes."),
      h("div", { class: "row" },
        h("a", { class: "btn", href: WAVE_PAY, target: "_blank", rel: "noopener" }, "Payer " + fmt(PRICE) + " avec Wave"),
        h("a", { class: "btn wa", href: "https://wa.me/" + ADMIN_WA + "?text=" + encodeURIComponent(msg), target: "_blank", rel: "noopener" }, "J'ai payé : prévenir Ela Group Services")),
      h("p", { class: "hint", style: "margin-top:12px" }, "Une fois votre paiement vérifié, votre boutique est réactivée pour 30 jours.")),
    h("div", { class: "row" }, h("button", { class: "btn ghost", onclick: viewEditShop }, "Modifier ma boutique"), logoutBtn()));
}

function boostPanel() {
  const b = sub && sub.boostUntil && sub.boostUntil.toDate ? sub.boostUntil.toDate() : null;
  const on = b && b > new Date();
  const msg = "Bonjour, j'ai payé le boost de ma boutique (" + fmt(BOOST_PRICE) + " pour " + BOOST_DAYS + " jours).\nBoutique : " + shop.name + "\nIdentifiant : " + user.uid;
  return h("div", { class: "panel" },
    h("h2", {}, "⭐ Booster ma boutique"),
    h("p", { class: "hint" }, on
      ? "Votre boutique est sponsorisée jusqu'au " + b.toLocaleDateString("fr-FR") + " : elle apparaît en tête de la liste."
      : "Pour " + fmt(BOOST_PRICE) + ", votre boutique passe en tête de la liste pendant " + BOOST_DAYS + " jours, avec le badge « Sponsorisée »."),
    h("div", { class: "row" },
      h("a", { class: "btn", href: WAVE_PAY, target: "_blank", rel: "noopener" }, "Payer " + fmt(BOOST_PRICE) + " avec Wave"),
      h("a", { class: "btn wa", href: "https://wa.me/" + ADMIN_WA + "?text=" + encodeURIComponent(msg), target: "_blank", rel: "noopener" }, "J'ai payé : prévenir Ela Group Services")));
}

function viewDashboard() {
  const st = subStatus();
  if (!st.active) return viewExpired();
  const subNote = st.paid
    ? note("ok", "Abonnement actif jusqu'au " + st.until.toLocaleDateString("fr-FR") + ".")
    : h("div", {}, h("span", { class: "promo" }, "🎁 Essai gratuit : il vous reste " + st.days + " jour" + (st.days > 1 ? "s" : "")), h("p", { class: "hint" }, "Jusqu'au " + st.until.toLocaleDateString("fr-FR") + ", puis 5 000 FCFA/mois."));
  const url = baseUrl() + "?b=" + encodeURIComponent(shop.slug);
  const copyMsg = h("span", { style: "font-size:.85rem;color:var(--teal)" });
  const share = h("div", { class: "panel" },
    h("h2", {}, shop.name), h("p", { class: "hint" }, "Voici le lien à envoyer à vos clients (Facebook, WhatsApp, statut…)."),
    h("div", { class: "linkbox" }, h("span", { style: "flex:1" }, url)),
    h("div", { class: "row" },
      h("button", { class: "btn", onclick: async () => { try { await navigator.clipboard.writeText(url); copyMsg.textContent = "Lien copié ✓"; } catch { copyMsg.textContent = "Copiez le lien ci-dessus."; } } }, "Copier le lien"),
      h("a", { class: "btn wa", target: "_blank", rel: "noopener", href: "https://wa.me/?text=" + encodeURIComponent("Découvrez ma boutique " + shop.name + " : " + url) }, "Partager sur WhatsApp"),
      h("a", { class: "btn ghost", href: url, target: "_blank", rel: "noopener" }, "Voir ma boutique"), copyMsg));

  const list = h("div", { class: "panel" }, h("h2", {}, "Mes produits (" + items.length + ")"),
    items.length ? null : h("p", { class: "hint" }, "Vous n'avez pas encore de produit. Ajoutez le premier ci-dessous."),
    items.map(p => {
      const img = safeImg(p.image);
      return h("div", { class: "item" },
        img ? h("img", { class: "thumb", src: img, alt: "" }) : h("div", { class: "thumb" }, "🛍"),
        h("div", { class: "info" }, h("b", {}, p.name), h("span", {}, fmt(p.price) + (p.available === false ? " · Épuisé" : "") + (p.sold > 0 ? " · " + p.sold + " vendu" + (p.sold > 1 ? "s" : "") : ""))),
        h("div", { class: "acts" },
          h("button", { class: "btn ghost", onclick: async () => {
            try { await updateDoc(doc(db, "shops", user.uid, "items", p.id), { sold: increment(1) }); await loadShop(); render(); }
            catch (e) { alert("Enregistrement impossible. Réessayez."); }
          } }, "Vendu +1"),
          p.sold > 0 ? h("button", { class: "btn ghost", onclick: async () => {
            try { await updateDoc(doc(db, "shops", user.uid, "items", p.id), { sold: increment(-1) }); await loadShop(); render(); }
            catch (e) { alert("Enregistrement impossible. Réessayez."); }
          } }, "−1") : null,
          h("button", { class: "btn ghost", onclick: () => viewProductForm(p) }, "Modifier"),
          h("button", { class: "btn danger", onclick: async () => {
            if (!confirm("Supprimer « " + p.name + " » ?")) return;
            try { await deleteDoc(doc(db, "shops", user.uid, "items", p.id)); await loadShop(); render(); } catch (e) { alert("Suppression impossible. Réessayez."); }
          } }, "Supprimer")));
    }),
    h("div", { class: "row" }, h("button", { class: "btn", onclick: () => viewProductForm(null) }, "+ Ajouter un produit")));

  root.replaceChildren(...(shop.blocked ? [note("err", "Votre boutique est suspendue : elle n'est plus visible par les clients. Contactez Ela Group Services.")] : []), subNote, boostPanel(), share, list,
    h("div", { class: "row" }, h("button", { class: "btn ghost", onclick: viewEditShop }, "Modifier ma boutique"), logoutBtn()));
}

function viewEditShop() {
  const msgBox = h("div");
  const name = h("input", { required: "", maxlength: "60", value: shop.name });
  const wa = h("input", { type: "tel", required: "", inputmode: "tel", value: shop.whatsapp });
  const desc = h("textarea", { maxlength: "200" }); desc.value = shop.description || "";
  const logoF = logoField(shop.logo);
  const form = h("form", {
    onsubmit: async ev => {
      ev.preventDefault(); msgBox.replaceChildren();
      const num = phoneNorm(wa.value);
      if (!num) { msgBox.replaceChildren(note("err", "Numéro WhatsApp invalide.")); return; }
      try {
        await updateDoc(doc(db, "shops", user.uid), { name: name.value.trim(), whatsapp: num, description: desc.value.trim(), logo: logoF.get() });
        await loadShop(); render();
      } catch (e) { msgBox.replaceChildren(note("err", "Enregistrement impossible. Réessayez.")); }
    }
  }, h("label", {}, "Nom de la boutique"), name, h("label", {}, "Numéro WhatsApp"), wa, h("label", {}, "Description"), desc, ...logoF.nodes,
     h("button", { class: "btn block", type: "submit" }, "Enregistrer"), msgBox);
  root.replaceChildren(h("div", { class: "panel" }, h("h2", {}, "Ma boutique"), form), h("button", { class: "btn ghost", onclick: render }, "← Retour"));
}

function viewProductForm(p) {
  if (!subStatus().active) return render();
  const msgBox = h("div");
  let images = p ? ((Array.isArray(p.images) && p.images.length) ? p.images.filter(safeImg) : (safeImg(p.image) ? [p.image] : [])) : [];
  const thumbs = h("div", { class: "thumbs" });
  const paintThumbs = () => thumbs.replaceChildren(...images.map((src, i) => h("div", {}, h("img", { src, alt: i === 0 ? "Photo principale" : "Photo " + (i + 1) }),
    h("button", { type: "button", "aria-label": "Retirer cette photo", onclick: () => { images.splice(i, 1); paintThumbs(); } }, "×"))));
  paintThumbs();
  const file = h("input", { type: "file", accept: "image/*", multiple: "", onchange: async () => {
    msgBox.replaceChildren();
    for (const f of [...file.files]) {
      if (images.length >= 4) { msgBox.replaceChildren(note("err", "4 photos maximum par produit.")); break; }
      try { images.push(await compress(f, 800, 0.72)); }
      catch { msgBox.replaceChildren(note("err", "Une photo n'a pas pu être lue. Essayez-en une autre.")); }
    }
    file.value = ""; paintThumbs();
  } });
  const name = h("input", { required: "", maxlength: "80", value: p ? p.name : "", placeholder: "Ex. Robe wax taille M" });
  const price = h("input", { type: "number", required: "", min: "0", step: "1", inputmode: "numeric", value: p ? p.price : "", placeholder: "Ex. 15000" });
  const desc = h("textarea", { maxlength: "300", placeholder: "Taille, couleur, état, livraison…" }); desc.value = p ? p.description || "" : "";
  const avail = h("input", { type: "checkbox" }); avail.checked = p ? p.available !== false : true;
  const submit = h("button", { class: "btn block", type: "submit" }, p ? "Enregistrer" : "Ajouter le produit");
  const form = h("form", {
    onsubmit: async ev => {
      ev.preventDefault(); msgBox.replaceChildren();
      const pr = Math.round(Number(price.value));
      if (!(pr >= 0)) { msgBox.replaceChildren(note("err", "Prix invalide.")); return; }
      submit.disabled = true;
      if (images.join("").length > 900000) { msgBox.replaceChildren(note("err", "Les photos sont trop lourdes : retirez-en une.")); submit.disabled = false; return; }
      const data = { name: name.value.trim(), price: pr, description: desc.value.trim(), images, image: images[0] || "", available: avail.checked };
      try {
        if (p) await updateDoc(doc(db, "shops", user.uid, "items", p.id), data);
        else await addDoc(collection(db, "shops", user.uid, "items"), { ...data, createdAt: serverTimestamp() });
        await loadShop(); render();
      } catch (e) { console.warn(e); msgBox.replaceChildren(note("err", "Enregistrement impossible. Réessayez.")); submit.disabled = false; }
    }
  },
    h("label", {}, "Photos du produit (4 maximum : la première est la photo principale)"), file, thumbs,
    h("label", {}, "Nom du produit"), name, h("label", {}, "Prix (FCFA)"), price,
    h("label", {}, "Description (facultatif)"), desc,
    h("label", { class: "check" }, avail, "Disponible à la vente"), submit, msgBox);
  root.replaceChildren(h("div", { class: "panel" }, h("h2", {}, p ? "Modifier le produit" : "Nouveau produit"), form),
    h("button", { class: "btn ghost", onclick: render }, "← Retour"));
}

/* ---------- Données et routage ---------- */
async function loadShop() {
  const s = await getDoc(doc(db, "shops", user.uid));
  shop = s.exists() ? s.data() : null; items = [];
  if (shop) {
    const snap = await getDocs(query(collection(db, "shops", user.uid, "items"), orderBy("createdAt", "desc")));
    items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    try { const a = await getDoc(doc(db, "abonnements", user.uid)); sub = a.exists() ? a.data() : null; } catch { sub = null; }
  }
}
function render() {
  if (!user) return viewAuth("signup");
  if (!shop) return viewCreateShop();
  viewDashboard();
}
onAuthStateChanged(auth, async u => {
  user = u; shop = null; items = [];
  who.textContent = u ? u.email : "";
  if (u) {
    try { await loadShop(); } catch (e) { console.warn(e); root.replaceChildren(h("div", { class: "panel" }, note("err", "Impossible de charger votre boutique (vérifiez votre connexion)."), logoutBtn())); return; }
  }
  render();
});
</script>
</body>
</html>
